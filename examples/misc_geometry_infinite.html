<!DOCTYPE html>
<html lang="en">
	<head>
		<title>three.js webgl - geometry - infinite </title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<link type="text/css" rel="stylesheet" href="main.css">
	</head>
	<body>

		<div id="info">
			<a href="https://threejs.org" target="_blank" rel="noopener">three.js</a> webgl - animation - groups
		</div>

		<script type="importmap">
			{
				"imports": {
					"three": "../build/three.module.js",
					"three/addons/": "./jsm/"
				}
			}
		</script>

		<script type="module">

			import * as THREE from 'three';
			import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

			import Stats from 'three/addons/libs/stats.module.js';

			import InfiniteGroundHelper from 'three/addons/helpers/InfiniteGroundHelper.js';
			


			let stats, clock;
			let scene, camera, renderer, mixer, orbitControls;

			const PI = Math.PI;
			const PI90 = Math.PI / 2;

			init();

						
			function createTextureFromBase64(base64String) {
				// Create an image element
				const img = new Image();
				
				// Set the base64 string as the image source
				img.src = base64String;
				
				// Create the texture
				const texture = new THREE.Texture(img);
				
				// Update texture when image loads
				img.onload = () => {
					texture.needsUpdate = true;
				};
				
				// Optional: Set texture parameters
				texture.minFilter = THREE.LinearFilter;
				texture.magFilter = THREE.LinearFilter;
				
				return texture;
			}


			function init() {

				scene = new THREE.Scene();

				//

				camera = new THREE.PerspectiveCamera( 40, window.innerWidth / window.innerHeight, 1, 1000 );
				camera.position.set( 50, 50, 100 );
				camera.lookAt( scene.position );

				// const grid = new InfiniteGridHelper(10, 100, new THREE.Color('white'), 1000); // size1, size2, color, distance
				//let groundtex = new THREE.TextureLoader().load('textures/terrain/ground.jpg');
				let groundtex = new THREE.TextureLoader().load('textures/terrain/grasslight-big.jpg');
				// let groundtex = new THREE.TextureLoader().load('textures/terrain/ground_seamless_texture_7143.jpg');
				// let groundtex = new THREE.TextureLoader().load('textures/brick_diffuse.jpg');
				// groundtex = false;
				const grid = new InfiniteGroundHelper(groundtex, 128, 1024, -5.5, 'xzy');
				scene.add(grid);

				// all objects of this animation group share a common animation state

				const animationGroup = new THREE.AnimationObjectGroup();
				const geometry = new THREE.BoxGeometry( 5, 5, 5 );
				const material = new THREE.MeshBasicMaterial( { transparent: true } );
				for ( let i = 0; i < 5; i ++ ) {
					for ( let j = 0; j < 5; j ++ ) {
						const mesh = new THREE.Mesh( geometry, material );
						mesh.position.x = 32 - ( 16 * i );
						mesh.position.y = 0;
						mesh.position.z = 32 - ( 16 * j );
						// scene.add( mesh );
						animationGroup.add( mesh );
					}

				}

				

				// render

				renderer = new THREE.WebGLRenderer( { antialias: true } );
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.setAnimationLoop( animate );
				document.body.appendChild( renderer.domElement );

				//

				stats = new Stats();
				document.body.appendChild( stats.dom );

				//

				clock = new THREE.Clock();

				// mouse control

				orbitControls = new OrbitControls( camera, renderer.domElement );
				orbitControls.target.set( 0, 1, 0 );
				orbitControls.enableDamping = true;
				orbitControls.enablePan = false;
				orbitControls.maxPolarAngle = PI90 - 0.05;
				orbitControls.update();

				window.addEventListener( 'resize', onWindowResize );

			}

			function onWindowResize() {

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();

				renderer.setSize( window.innerWidth, window.innerHeight );

			}

			function animate() {

				const delta = clock.getDelta();

				if ( mixer ) {

					mixer.update( delta );

				}

				renderer.render( scene, camera );

				stats.update();

			}

		</script>

	</body>
</html>
