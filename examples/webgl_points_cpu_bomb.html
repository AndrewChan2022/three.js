<!DOCTYPE html>
<html lang="en">
    <head>
        <title>three.js webgl - particles - keyframe animation</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
        <style>
            body {
                margin: 0;
                overflow: hidden;
            }
            #info {
                position: absolute;
                top: 10px;
                left: 10px;
                color: #fff;
                font-family: Arial, sans-serif;
                font-size: 14px;
            }
            #controls {
                position: absolute;
                top: 10px;
                right: 10px;
                background: rgba(0, 0, 0, 0.7);
                color: #fff;
                padding: 10px;
                font-family: Arial, sans-serif;
                font-size: 14px;
                border-radius: 5px;
                user-select: none;
            }
            #controls label {
                display: block;
                margin-bottom: 5px;
            }
            #controls input[type="range"] {
                width: 100%;
            }
        </style>
    </head>
    <body>
        <div id="info">
            <a href="https://threejs.org" target="_blank" rel="noopener">three.js</a> - particle keyframe animation
        </div>
        <div id="controls">
            <label>Radius Scale: <span id="radiusValue">1.0</span>
                <input type="range" id="radiusSlider" min="0.1" max="150.0" step="0.1" value="1.0">
            </label>
            <label>Animation Speed: <span id="speedValue">0.1</span>
                <input type="range" id="speedSlider" min="0" max="1" step="0.01" value="0.25">
            </label>
        </div>

        <script type="importmap">
            {
                "imports": {
                    "three": "../build/three.module.js",
                    "three/addons/": "./jsm/"
                }
            }
        </script>

        <script type="module">
            import * as THREE from 'three';
            import Stats from 'three/addons/libs/stats.module.js';

            class BombSystem {
                constructor({
                    jsonFile,
                    binFile,
                    radiusScale = 1.0,
                    animationSpeed = 0.1,
                    scene,
                    camera
                }) {
                    this.jsonFile = jsonFile;
                    this.binFile = binFile;
                    this.radiusScale = radiusScale;
                    this.animationSpeed = animationSpeed;
                    this.scene = scene;
                    this.camera = camera;
                    this.particles = null;
                    this.animationData = null;
                    this.particleData = null;
                    this.currentFrame = 0;
                    this.lastTime = null;

                    this.vertexShader = `
                        attribute float radius;
                        attribute float groupId;
                        varying float vPointSize;
                        varying float vGroupId;
                        varying vec3 vViewPos;
                        varying float vRadius;
                        uniform float screenHeight;
                        uniform float tanFovOver2;
                        uniform float radiusScale;

                        void main() {
                            vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
                            gl_Position = projectionMatrix * mvPosition;
                            float viewZ = -mvPosition.z;
                            gl_PointSize = 500.0 * (radius * radiusScale * screenHeight) / (viewZ * tanFovOver2);
                            vPointSize = gl_PointSize;
                            vGroupId = groupId;
                            vViewPos = mvPosition.xyz; // Store view-space position
                            vRadius = radius * radiusScale;
                        }
                    `;

                    this.fragmentShader = `
                        uniform vec3 lightDirection;
                        uniform float screenHeight;
                        uniform float tanFovOver2;
                        uniform mat4 projectionMatrix; // Use uniform instead of varying
                        uniform float near;
                        uniform float far;
                        varying float vPointSize;
                        varying float vGroupId;
                        varying vec3 vViewPos; // Receive view-space position
                        varying float vRadius;

                        vec3 getColor(float groupId) {
                            if (groupId < 1.5) return vec3(0.7, 0.7, 0.03);
                            if (groupId < 2.5) return vec3(0.32, 0.01, 0.30);
                            return vec3(0.30, 0.31, 0.51);
                        }

                        void main() {
                            vec2 coord = gl_PointCoord * 2.0 - 1.0;
                            float dist2 = dot(coord, coord);
                            float alpha = smoothstep(1.0, 0.81, dist2);
                            if (alpha < 0.01) discard;

                            // Calculate sphere surface normal
                            float z = sqrt(1.0 - dist2);
                            vec3 normal = normalize(vec3(coord.x, coord.y, z));

                            // Compute fragment position on sphere surface in view space
                            float radiusWorld = vRadius;
                            vec3 fragOffset = normal * radiusWorld;
                            vec3 fragViewPos = vViewPos + fragOffset; // Offset from center in view space

                            // Discard pixels beyond near or far planes
                            float viewZ = -fragViewPos.z;
                            if (viewZ < near || viewZ > far) discard;

                            // Transform to clip space
                            vec4 clipPos = projectionMatrix * vec4(fragViewPos, 1.0);

                            // Compute depth
                            float fragZ = clipPos.z / clipPos.w;
                            gl_FragDepth = clamp((fragZ * 0.5 + 0.5), 0.0, 1.0);

                            // Lighting calculations
                            vec3 lightDir = normalize(lightDirection);
                            float diffuse = max(0.0, dot(normal, lightDir));
                            float ambient = 0.3;
                            float lighting = ambient + diffuse;

                            vec3 color = getColor(vGroupId);
                            gl_FragColor = vec4(color * lighting, 1.0);
                        }
                    `;
                }

                generateFakeParticles() {
                    return {
                        particle_count: 2,
                        seconds_per_step: 0.0002,
                        animation_step_count: 600,
                        radius: [2.0, 2.0],
                        group: [1.0, 2.0]
                    };
                }

                generateFakeAnimations() {
                    const numParticles = 2;
                    const frames = 600;
                    const floatsPerParticle = 6;
                    const animationData = new Float32Array(numParticles * frames * floatsPerParticle);

                    for (let frame = 0; frame < frames; frame++) {
                        let x2;
                        if (frame <= 299) {
                            x2 = 0.5 + (100.0 - 0.5) * (frame / 299);
                        } else {
                            x2 = 100.0 - (100.0 - 0.5) * ((frame - 300) / 299);
                        }

                        const offset1 = frame * numParticles * floatsPerParticle;
                        animationData[offset1 + 0] = 0.0; // Particle 1: x
                        animationData[offset1 + 1] = 0.0; // y
                        animationData[offset1 + 2] = 0.0; // z
                        animationData[offset1 + 3] = 0.0; // vx
                        animationData[offset1 + 4] = 0.0; // vy
                        animationData[offset1 + 5] = 0.0; // vz

                        const offset2 = offset1 + floatsPerParticle;
                        animationData[offset2 + 0] = x2;  // Particle 2: x
                        animationData[offset2 + 1] = 0.0;
                        animationData[offset2 + 2] = 0.0;
                        animationData[offset2 + 3] = 0.0;
                        animationData[offset2 + 4] = 0.0;
                        animationData[offset2 + 5] = 0.0;
                    }

                    return animationData;
                }

                async init() {
                    const jsonResponse = await fetch(this.jsonFile);
                    this.particleData = await jsonResponse.json();
                    // this.particleData = this.generateFakeParticles(); // fake
                    this.seconds_per_step = this.particleData.seconds_per_step;
                    
                    const binResponse = await fetch(this.binFile);
                    const binData = await binResponse.arrayBuffer();
                    this.animationData = new Float32Array(binData);
                    // this.animationData = this.generateFakeAnimations();  // fake

                    const numParticles = this.particleData.particle_count;
                    const positions = new Float32Array(numParticles * 3);
                    const radii = new Float32Array(numParticles);
                    const groupIds = new Float32Array(numParticles);
                    
                    const floatsPerParticle = 6;
                    
                    for (let i = 0; i < numParticles; i++) {
                        const dataOffset = i * floatsPerParticle;
                        positions[i * 3] = this.animationData[dataOffset];
                        positions[i * 3 + 1] = this.animationData[dataOffset + 1];
                        positions[i * 3 + 2] = this.animationData[dataOffset + 2];
                        radii[i] = this.particleData.radius[i];
                        groupIds[i] = this.particleData.group[i];
                    }

                    const geometry = new THREE.BufferGeometry();
                    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
                    geometry.setAttribute('radius', new THREE.BufferAttribute(radii, 1));
                    geometry.setAttribute('groupId', new THREE.BufferAttribute(groupIds, 1));

                    this.material = new THREE.ShaderMaterial({
                        uniforms: {
                            lightDirection: { value: new THREE.Vector3(1, 1, 1).normalize() },
                            screenHeight: { value: window.innerHeight },
                            tanFovOver2: { value: Math.tan((this.camera.fov * Math.PI / 180) / 2) },
                            radiusScale: { value: this.radiusScale },
                            near: { value: this.camera.near },
                            far: { value: this.camera.far }
                        },
                        vertexShader: this.vertexShader,
                        fragmentShader: this.fragmentShader,
                        transparent: false,
                        depthTest: true,
                        depthWrite: true,
                        blending: THREE.NoBlending
                    });

                    this.particles = new THREE.Points(geometry, this.material);
                    this.scene.add(this.particles);
                }

                update() {
                    if (!this.particles || !this.animationData || !this.particleData) return;

                    const now = performance.now() / 1000;
                    if (!this.lastTime) this.lastTime = now;
                    
                    const frameTime = this.seconds_per_step / this.animationSpeed;
                    const elapsed = now - this.lastTime;
                    const frames = this.particleData.animation_step_count;
                    
                    this.currentFrame = Math.floor(elapsed / frameTime) % frames;

                    const positions = this.particles.geometry.attributes.position.array;
                    const numParticles = this.particleData.particle_count;
                    const floatsPerParticle = 6;
                    const particlesPerFrame = numParticles * floatsPerParticle;
                    const frameOffset = this.currentFrame * particlesPerFrame;

                    for (let i = 0; i < numParticles; i++) {
                        const dataOffset = frameOffset + (i * floatsPerParticle);
                        positions[i * 3] = this.animationData[dataOffset];
                        positions[i * 3 + 1] = this.animationData[dataOffset + 1];
                        positions[i * 3 + 2] = this.animationData[dataOffset + 2];
                    }

                    this.particles.geometry.attributes.position.needsUpdate = true;
                    this.material.uniforms.radiusScale.value = this.radiusScale;
                    this.material.uniforms.screenHeight.value = window.innerHeight;
                }

                setRadiusScale(scale) {
                    this.radiusScale = scale;
                }

                setAnimationSpeed(speed) {
                    this.animationSpeed = Math.max(0.001, speed);
                    this.lastTime = performance.now() / 1000;
                }
            }

            let container, stats;
            let camera, scene, renderer;
            let bombSystem;
            let mouseX = 0, mouseY = 0;
            let windowHalfX = window.innerWidth / 2;
            let windowHalfY = window.innerHeight / 2;

            init();

            async function init() {
                container = document.createElement('div');
                document.body.appendChild(container);

                camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
                camera.position.z = 250;

                scene = new THREE.Scene();

                bombSystem = new BombSystem({
                    jsonFile: 'textures/bomb/particles_data_4619.json',
                    binFile: 'textures/bomb/particles_data_4619.bin',
                    radiusScale: 1.0,
                    animationSpeed: 0.1,
                    scene,
                    camera
                });
                await bombSystem.init();

                renderer = new THREE.WebGLRenderer({ antialias: true });
                renderer.setPixelRatio(window.devicePixelRatio);
                renderer.setSize(window.innerWidth, window.innerHeight);
                renderer.setAnimationLoop(animate);
                container.appendChild(renderer.domElement);

                stats = new Stats();
                stats.dom.style.position = 'absolute';
                stats.dom.style.top = '100px';
                stats.dom.style.right = '10px';
                container.appendChild(stats.dom);

                // Set up UI event listeners
                const radiusSlider = document.getElementById('radiusSlider');
                const radiusValue = document.getElementById('radiusValue');
                const speedSlider = document.getElementById('speedSlider');
                const speedValue = document.getElementById('speedValue');

                // Initialize speed display
                const initialSpeed = 0.1;
                speedValue.textContent = initialSpeed.toFixed(3);
                speedSlider.value = 0.25; // Maps to 0.1 in linear scale

                radiusSlider.addEventListener('input', () => {
                    const value = parseFloat(radiusSlider.value);
                    bombSystem.setRadiusScale(value);
                    radiusValue.textContent = value.toFixed(1);
                });

                speedSlider.addEventListener('input', () => {
                    const t = parseFloat(speedSlider.value); // t ranges from 0 to 1
                    // Logarithmic mapping: 0 to 1 maps to 0.001 to 10.0
                    const minSpeed = Math.log(0.001);
                    const maxSpeed = Math.log(10.0);
                    const logSpeed = minSpeed + (maxSpeed - minSpeed) * t;
                    const speed = Math.exp(logSpeed);
                    bombSystem.setAnimationSpeed(speed);
                    speedValue.textContent = speed.toFixed(3);
                });

                container.style.touchAction = 'none';
                container.addEventListener('pointermove', onPointerMove);
                window.addEventListener('resize', onWindowResize);
            }

            function onWindowResize() {
                windowHalfX = window.innerWidth / 2;
                windowHalfY = window.innerHeight / 2;
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            }

            function onPointerMove(event) {
                if (event.isPrimary === false) return;
                mouseX = event.clientX - windowHalfX;
                mouseY = event.clientY - windowHalfY;
            }

            function animate() {
                render();
                stats.update();
            }

            function render() {
                // camera.position.x += (mouseX - camera.position.x) * 0.02;
                // camera.position.y += (-mouseY - camera.position.y) * 0.02;
                camera.lookAt(scene.position);

                bombSystem.update();
                renderer.render(scene, camera);
            }
        </script>
    </body>
</html>
